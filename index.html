<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MS Dhoni</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; background: #0b1320; color: #e6eefc; }
      .card { padding: 24px; border-radius: 16px; background: rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.35); max-width: 720px; width: calc(100% - 32px); text-align: center; }
      h1 { margin: 0 0 16px; font-size: 28px; letter-spacing: 0.4px; }
      figure { margin: 0; }
      img { width: 100%; max-width: 640px; height: auto; border-radius: 12px; display: block; margin: 0 auto; }
      figcaption { margin-top: 10px; font-size: 14px; opacity: 0.85; }
      a { color: #9ec7ff; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>MS Dhoni</h1>
      <figure>
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/7/76/Mahendra_Singh_Dhoni_receiving_Padma_Bhushan.jpg"
          alt="MS Dhoni receiving the Padma Bhushan"
          loading="lazy"
        />
        <figcaption>
          Image via <a href="https://commons.wikimedia.org/" target="_blank" rel="noreferrer noopener">Wikimedia Commons</a>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
